          - name: title
            label: "Titel"
            type: string
          - name: items
            label: "Onderdelen"
            type: object
            list: true
            fields:
              - name: q
                label: "Vraag"
                type: string
              - name: a
                label: "Antwoord"
                type: text
      - name: contact
        label: "Contact"
        type: object
        fields:
          - name: label
            label: "Klein label"
            type: string
          - name: title
            label: "Titel"
            type: string
          - name: text
            label: "Tekst"
            type: text
          - name: form_options
            label: "Keuzes in het formulier"
            type: string
            list: true
          - name: form_message_placeholder
            label: "Voorbeeldtekst in het berichtveld"
