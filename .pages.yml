      - name: offer
        label: "Kop boven het aanbod"
        type: object
        fields:
          - name: label
            label: "Klein label"
            type: string
          - name: title
            label: "Titel"
            type: string
      - name: principles
        label: "Uitgangspunten"
        type: object
        fields:
          - name: label
            label: "Klein label"
            type: string
          - name: title
            label: "Titel"
            type: string
          - name: items
            label: "Onderdelen"
            type: object
            list: true
            fields:
              - name: title
