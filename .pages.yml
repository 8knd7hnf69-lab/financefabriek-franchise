  - name: diensten
    label: "Dienstpagina's"
    type: file
    path: content/diensten.json
    format: json
    fields:
      - name: diensten
        label: "Diensten"
        type: object
        list: true
        fields:
          - name: slug
            label: "Adres van de pagina"
            type: string
          - name: group
            label: Groep
            type: select
            options:
              values: [kern, aanvullend]
          - name: code
            label: "Klein label"
            type: string
          - name: title
            label: "Titel"
            type: string
          - name: summary
            label: "Korte omschrijving"
            type: text
          - name: intro
            label: "Intro"
            type: text
          - name: image
            label: "Foto"
            type: image
          - name: points
            label: "Opsommingspunten"
            type: string
            list: true
          - name: note
            label: "Toelichting"
            type: text
  - name: gidsen
    label: "Gidsen"
    type: file
    path: content/gidsen.json
    format: json
    fields:
      - name: gidsen
        label: "Gidsen"
        type: object
        list: true
        fields:
          - name: slug
            label: "Adres van de pagina"
            type: string
          - name: code
            label: "Klein label"
            type: string
          - name: title
            label: "Titel"
            type: string
          - name: summary
            label: "Korte omschrijving"
            type: text
          - name: image
            label: "Foto"
            type: image
          - name: sections
            label: "Alinea's"
            type: object
            list: true
            fields:
              - name: heading
                label: "Tussenkop"
                type: string
              - name: text
                label: "Tekst"
                type: text
