<script>
document.querySelectorAll('form[data-netlify]').forEach(function (form) {
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var msg = form.querySelector('.form-msg');
    try {
      var body = new URLSearchParams(new FormData(form)).toString();
      var r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
      if (!r.ok) throw new Error();
      form.reset();
      msg.textContent = 'Bedankt! We nemen binnen één werkdag contact met je op.';
    } catch (err) {
      msg.textContent = 'Versturen lukte niet. Probeer het later opnieuw of mail ons op info@financefabriek.nl.';
    }
  });
});
</script>
<!-- WhatsApp Business-knop (De Finance Fabriek) -->

<style>
.dff-wa{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:9999;width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,14,2,.32);text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.dff-wa:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(20,14,2,.38)}
.dff-wa:focus-visible{outline:3px solid #FFB81C;outline-offset:3px}
@media (max-width:560px){.dff-wa{width:54px;height:54px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.dff-wa{transition:none}.dff-wa:hover{transform:none}}
@media print{.dff-wa{display:none}}
</style>
<script>
(function(){
  var a=document.getElementById('dff-wa');if(!a)return;
  var T={"nl": "Hallo De Finance Fabriek, ik heb een vraag over het franchisepakket.", "en": "Hi De Finance Fabriek, I have a question about the franchise package."};
  function lang(){
    var v=document.querySelector('.pv:not([hidden])[lang]');
    var l=(v&&v.getAttribute('lang'))||document.documentElement.getAttribute('lang')||(/^\/en(\/|$)/.test(location.pathname)?'en':'nl');
    return l.slice(0,2).toLowerCase()==='en'?'en':'nl';
  }
  function upd(){
    var l=lang();
    a.href='https://wa.me/31850471046?text='+encodeURIComponent(T[l]);
    var lbl=l==='en'?'Chat with us on WhatsApp':'Chat met ons via WhatsApp';
    a.setAttribute('aria-label',lbl);a.title=lbl;
  }
  upd();
  a.addEventListener('pointerdown',upd);a.addEventListener('focus',upd);a.addEventListener('click',upd);
  document.addEventListener('click',function(){setTimeout(upd,0);});
  window.addEventListener('popstate',upd);
})();
</script>
